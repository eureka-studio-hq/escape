<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="escape — leave the in-app browser with your progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15120f"/>
      <stop offset="1" stop-color="#241d14"/>
    </linearGradient>
    <clipPath id="r"><rect width="1600" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1600" height="420" fill="url(#bg)"/>
    <!-- faint grid, like a road -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 105H1600M0 210H1600M0 315H1600"/>
      <path d="M200 0V420M400 0V420M600 0V420M800 0V420M1000 0V420M1200 0V420M1400 0V420"/>
    </g>
    <!-- mark: a phone frame with the page leaving it -->
    <g transform="translate(120 90)">
      <rect x="0" y="0" width="150" height="240" rx="26" fill="none" stroke="#fff6e0" stroke-opacity="0.35" stroke-width="10"/>
      <rect x="38" y="60" width="150" height="150" rx="18" fill="#ffd23d"/>
      <path d="M86 135h66M126 109l26 26-26 26" fill="none" stroke="#15120f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- wordmark -->
    <text x="380" y="150" fill="#fff6e0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" opacity="0.8">Eureka Studios</text>
    <text x="376" y="250" fill="#ffd23d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3">escape</text>
    <text x="380" y="318" fill="#fff6e0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" opacity="0.85">Leave the in-app browser. Keep your progress.</text>
    <!-- bottom accent -->
    <rect x="0" y="408" width="1600" height="12" fill="#ffd23d"/>
  </g>
</svg>
