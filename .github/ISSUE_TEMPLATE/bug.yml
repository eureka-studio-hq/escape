name: Bug
description: Something behaves wrongly
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: App, OS and version
      placeholder: e.g. Instagram on iOS 17.5
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A code snippet or a link.
